name: Generate determinant source
on:
  push:
    branches: ['work/classical-determinants']
    paths: ['scripts/generate_det_expansion.py', '.github/workflows/determinant-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/classical-determinants
      - run: python3 scripts/generate_det_expansion.py
      - name: Commit only generated Lean source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add formal/IncidenceCubes/Classical/DetExpansion.lean
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add staged determinant expansions with kernel proofs'
          git push origin HEAD:work/classical-determinants
