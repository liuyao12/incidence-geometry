name: Prepare tested Chern conic layout
on:
  push:
    branches: ['work/chern-conic-layout']
    paths: ['scripts/apply_chern_layout.py', '.github/workflows/chern-layout-build.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/chern-conic-layout
      - name: Apply byte-checked layout update and run mathematical tests
        run: |
          python3 scripts/apply_chern_layout.py
          node --check app.js
          node test.cjs
          node test-ganja.cjs
          node test-chern.cjs
      - name: Commit the tested source without changing workflows
        run: |
          git restore .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine.js app.js ganja-view.js pga.js style.css index.html test.cjs test-ganja.cjs test-chern.cjs chern-test-results.json ganja-test-results.json scripts/browser_smoke.py README.md
          git rm scripts/apply_chern_layout.py
          git commit -m 'Arrange conic cube after Chern reference with separated ellipses and dashed completion'
          git push origin HEAD:work/chern-conic-layout
