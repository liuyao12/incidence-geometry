name: Validate three-page results release
on:
  push:
    branches: ['work/publish-results-20260919']
    paths: ['.release/**', '.github/workflows/prepare-results.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-results-release
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/publish-results-20260919
      - name: Assemble hash-checked ordinary source
        run: python3 .release/assemble.py
      - name: Check all mathematical engines and references
        run: |
          node test.cjs
          node test-ganja.cjs
          node test-chern.cjs
          node test-narrative.cjs
          node test-moduli.cjs
          node test-vector-moduli.cjs
          node test-conic-net.cjs
          python3 scripts/check_site_links.py
          python3 scripts/check_release_sources.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise actual HTTP-loaded chapters and all regressions
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python scripts/browser_smoke.py --serve
          python scripts/browser_narrative.py --serve
          python scripts/browser_moduli.py --serve
          python scripts/browser_focus.py --serve
          python scripts/browser_vectors.py --serve
          python scripts/browser_results.py --serve
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          use-mathlib-cache: 'true'
          build: 'true'
          test: 'false'
          lint: 'false'
      - name: Refresh the complete 225-theorem dependency audit
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Audit.lean | tee ../verification/release-axioms.txt
          python3 ../scripts/audit_axioms.py ../verification/release-axioms.txt | tee ../verification/release-audit.json
      - name: Commit only the tested ordinary source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json, subprocess
          paths = json.load(open('.release/paths.json'))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git diff --cached --stat
          git commit -m 'Add validated results-first chapters and conic-contact surface formalization'
          git push origin HEAD:work/publish-results-20260919
          git rev-parse HEAD > .release/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-release-verification
          path: |
            verification/release-axioms.txt
            verification/release-audit.json
            .release/verified-commit.txt
            *test-results.json
            *browser-test-results.json
            release-*.png
            results-*.png
            vector-controls-preview.png
            narrative-dandelin-preview.png
