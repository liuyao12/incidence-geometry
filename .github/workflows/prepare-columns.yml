name: Validate dedicated chapter columns
on:
  push:
    branches: ['work/column-layout-20260920']
    paths: ['.release/**', '.github/workflows/prepare-columns.yml', 'columns.*', 'scripts/browser_columns.py', 'COLUMN_LAYOUT.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-chapter-columns
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/column-layout-20260920
      - name: Assemble the explicit column-layout edits
        run: python3 .release/prepare_columns.py
      - name: Check all mathematical engines, references and fingerprints
        run: |
          node test.cjs
          node test-ganja.cjs
          node test-chern.cjs
          node test-narrative.cjs
          node test-moduli.cjs
          node test-vector-moduli.cjs
          node test-conic-net.cjs
          node test-oriented-net.cjs
          node test-journey-view.cjs
          python3 scripts/generate_oriented_example.py
          python3 scripts/check_site_links.py
          python3 scripts/check_release_sources.py
          python3 scripts/check_math_assets.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all ten browser suites on actual HTTP-loaded pages
        shell: bash
        run: |
          set -euo pipefail
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python scripts/browser_columns.py --serve
          python scripts/browser_smoke.py --serve
          python scripts/browser_narrative.py --serve
          python scripts/browser_moduli.py --serve
          python scripts/browser_focus.py --serve
          python scripts/browser_vectors.py --serve
          python scripts/browser_results.py --serve
          python scripts/browser_review.py --serve
          python scripts/browser_journey_view.py --serve
          python scripts/browser_theorems.py --serve
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          use-mathlib-cache: 'true'
          build: 'true'
          test: 'false'
          lint: 'false'
      - name: Audit the unchanged mathematical library
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Audit.lean | tee axiom-audit-current.txt
          python3 ../scripts/audit_axioms.py axiom-audit-current.txt | tee audit-report.json
      - name: Commit only tested ordinary source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          paths=json.loads(Path('.release/column-paths.json').read_text())
          subprocess.run(['git','add','--',*paths,'columns-browser-test-results.json'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'Give each geometry chapter a dedicated text and interactive column'
          git push origin HEAD:work/column-layout-20260920
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter-column-verification
          path: |
            columns-browser-test-results.json
            columns-*-desktop.png
            columns-*-mobile.png
            *browser-test-results.json
            formal/axiom-audit-current.txt
            formal/audit-report.json
