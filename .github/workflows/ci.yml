name: Geometry, browser and Lean checks
on:
  push:
    paths-ignore: ['.github/workflows/ganja-fixtures.yml', '.github/workflows/vendor-ganja.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: incidence-geometry-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record formal source independently of build outcome
        uses: actions/upload-artifact@v4
        with:
          name: formal-source
          path: |
            formal/**/*.lean
            formal/lean-toolchain
            formal/lake-manifest.json
            formal/README.md
            research/
            scripts/
            theorem-map.json
            verification/release-source-hashes.json
          retention-days: 7
      - name: Test mathematical engines, generated source, fingerprints and references
        run: |
          node test.cjs
          node test-ganja.cjs
          node test-chern.cjs
          node test-narrative.cjs
          node test-moduli.cjs
          node test-vector-moduli.cjs
          node test-conic-net.cjs
          node test-oriented-net.cjs
          node test-journey-view.cjs
          node test-fomin-classics.cjs
          node test-conic-bridge.cjs
          python3 scripts/generate_oriented_example.py
          python3 scripts/check_site_links.py
          python3 scripts/check_release_sources.py
          python3 scripts/check_math_assets.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test all HTTP-loaded chapters and interaction regressions in Chromium
        shell: bash
        run: |
          set -euo pipefail
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python scripts/browser_smoke.py --serve
          python scripts/browser_narrative.py --serve
          python scripts/browser_moduli.py --serve
          python scripts/browser_focus.py --serve
          python scripts/browser_vectors.py --serve
          python scripts/browser_results.py --serve
          python scripts/browser_review.py --serve
          python scripts/browser_journey_view.py --serve
          python scripts/browser_theorems.py --serve
          python scripts/browser_columns.py --serve
          python scripts/browser_fomin_classics.py --serve
          python scripts/browser_conic_bridge.py --serve
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          use-mathlib-cache: 'true'
          build: 'true'
          test: 'false'
          lint: 'false'
      - name: Audit every public theorem against the axiom allowlist
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Audit.lean | tee axiom-audit-current.txt
          python3 ../scripts/audit_axioms.py axiom-audit-current.txt "$GITHUB_SHA" | tee audit-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: incidence-geometry-checks
          path: |
            formal/axiom-audit-current.txt
            formal/audit-report.json
            test-results.json
            ganja-test-results.json
            chern-test-results.json
            ganja-browser-test-results.json
            moduli-test-results.json
            moduli-browser-test-results.json
            moduli-preview.png
            moduli-mobile-preview.png
            vector-test-results.json
            vector-browser-test-results.json
            vector-controls-preview.png
            vector-controls-mobile.png
            narrative-test-results.json
            narrative-browser-test-results.json
            focus-test-results.json
            focus-fixed-preview.png
            narrative-cube-preview.png
            narrative-dandelin-preview.png
            narrative-mobile-preview.png
            ganja-preview.png
            ganja-mobile-preview.png
            chern-eight-preview.png
            chern-mobile-preview.png
            conic-net-test-results.json
            oriented-net-test-results.json
            results-browser-test-results.json
            review-browser-test-results.json
            review-surface-desktop.png
            review-surface-mobile.png
            release-conic-surface-preview.png
            release-conic-surface-mobile.png
            journey-view-test-results.json
            journey-view-browser-test-results.json
            paper-stage-*.png
            paper-journey-*.png
            theorem-browser-test-results.json
            theorem-*-desktop.png
            theorem-*-mobile.png
            columns-browser-test-results.json
            columns-*-desktop.png
            columns-*-mobile.png
            fomin-classics-test-results.json
            fomin-classics-browser-test-results.json
            fomin-applications-*.png
            conic-bridge-test-results.json
            conic-bridge-browser-test-results.json
            connections-bridge-*.png
