name: Validate bidirectional cube controls
on:
  push:
    branches: [work/vector-controls]
    paths: ['scripts/_vectors_*.b64', 'scripts/_apply_vectors.py', '.github/workflows/prepare-vectors.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/vector-controls
      - name: Assemble exact tested source
        run: python3 scripts/_apply_vectors.py
      - name: Test all mathematical engines
        run: |
          node test.cjs
          node test-ganja.cjs
          node test-chern.cjs
          node test-narrative.cjs
          node test-moduli.cjs
          node test-vector-moduli.cjs
          python3 scripts/check_site_links.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test real browser interaction and regressions
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python scripts/browser_vectors.py --serve
          python scripts/browser_narrative.py --serve
          python scripts/browser_moduli.py --serve
          python scripts/browser_focus.py --serve
      - name: Commit validated ordinary source files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs -d '\n' git add -- < /tmp/vector-paths.txt
          git add vector-test-results.json vector-browser-test-results.json
          git rm scripts/_vectors_a.b64 scripts/_vectors_b.b64 scripts/_vectors_c.b64 scripts/_apply_vectors.py
          git commit -m 'Add tested bidirectional framed-vector controls for Penrose conics'
          git push origin HEAD:work/vector-controls
          git rev-parse HEAD > vector-verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-control-validation
          path: |
            vector-verified-commit.txt
            vector-test-results.json
            vector-browser-test-results.json
            vector-controls-preview.png
            vector-controls-mobile.png
            narrative-browser-test-results.json
            moduli-browser-test-results.json
            focus-test-results.json
